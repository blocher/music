upstream backend_music {
    server 127.0.0.1:8005;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.benlocher.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.benlocher.com;

    ssl_certificate /etc/letsencrypt/live/music.benlocher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.benlocher.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    root /var/www/music.benlocher.com/frontend/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        etag on;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /static/ {
        alias /var/www/music.benlocher.com/backend/staticfiles/;
        try_files $uri =404;
        expires 7d;
        etag on;
    }

    location /media/ {
        alias /var/lib/music/media/;
        try_files $uri =404;
        add_header Accept-Ranges bytes always;
        expires 7d;
        etag on;
        gzip off;
    }

    location /api/ {
        proxy_pass http://backend_music;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
